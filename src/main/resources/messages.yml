  not-enough-nacar: "{prefix}<red>Você não tem nacar suficiente! Necessário: <aqua>{cost}"

class:
  equipped: "{prefix}<green>Classe <aqua>{class} <green>equipada!"
  upgraded: "{prefix}<green>Você evoluiu para a classe <aqua>{class}<green>!"
  need-previous: "{prefix}<red>Você precisa da classe anterior primeiro!"
  not-enough-resources: "{prefix}<red>Recursos insuficientes para evoluir!"
  already-equipped: "{prefix}<gray>Você já está usando esta classe."

npc:
  spawned: "{prefix}<green>NPC de pesca spawnado!"
  removed: "{prefix}<red>NPC de pesca removido."

area:
  entered: "{prefix}<green>Você entrou na área de pesca!"
  left: "{prefix}<gray>Você saiu da área de pesca."
  teleported: "{prefix}<green>Teleportado para a <aqua>{area}<green>!"
  not-configured: "{prefix}<red>A área de pesca ainda não foi configurada pelo staff."
  not-in-area: "{prefix}<gray>Você não está na área de pesca."
  invisibility-on: "{prefix}<gray>Invisibilidade <green>ativada<gray>."
  invisibility-off: "{prefix}<gray>Invisibilidade <red>desativada<gray>."
  pvp-disabled: "{prefix}<red>PvP está desativado na área de pesca!"
  command-blocked: "{prefix}<red>Este comando não é permitido enquanto pesca!"
  inventory-full: "{prefix}<red>Seu inventário está cheio! A vara foi largada no chão."

mcmmo:
  xp-gained: "{prefix}<green>+<aqua>{xp} <green>XP de pesca (mcMMO)"

admin:
  area-set: "{prefix}<green>Área de pesca definida! Use /alkafish area spawn para ajustar o spawn."
