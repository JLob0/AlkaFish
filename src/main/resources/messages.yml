# Mensagens do AlkaFish (MiniMessage)

prefix: "<dark_aqua>[AlkaFish] "

fish:
  caught: "{prefix}<green>Você pescou um {rarity} <green>de <yellow>{length}cm <green>e <yellow>{weight}kg<green>!"
  escaped: "{prefix}<red>O peixe escapou..."
  bag-full: "{prefix}<red>Sua Fish Bag está cheia! Venda alguns peixes."
  legendary-broadcast: "<gold><bold>🏆 {player} pescou um {fish} LENDÁRIO de {length}cm!"
  started_title: "<green><bold>Pesca</bold>\n<yellow>Você começou a pescar"
  started_subtitle: "<yellow>Mantenha-se na água para pescar automaticamente"
  stopped_title: "<green><bold>Pesca</bold>\n<red>Você parou de pescar"
  stopped_subtitle: "<red>Linha recolhida"
  stopped: "{prefix}<gray>Linha recolhida! Você pescou <yellow>{count} <gray>peixe(s) nesta sessão."
  afk_count: "<aqua>🎣 Você pescou <yellow>{count} {name}</aqua>!"

bag:
  opened: "{prefix}<gray>Abrindo Fish Bag..."
  weight-status: "<gray>Peso: <aqua>{current}<gray>/<aqua>{max} kg"

sell:
  no-fish: "{prefix}<red>Você não tem peixes para vender!"
  success: "{prefix}<green>Vendido <yellow>{count} <green>peixes por <yellow>${amount}<green>!"
  cancelled: "{prefix}<gray>Venda cancelada."
  autosell-toggle: "{prefix}<gray>Auto-venda configurada no AlkaShop."

bag:
  sold: "{prefix}<green>Você vendeu <yellow>x{amount} {fish}</yellow> por <yellow>${price} coins</yellow>."
  sold_all: "{prefix}<green>Você vendeu todos os seus peixes por <yellow>${price} coins</yellow>."
  empty: "{prefix}<red>Sua sacola está vazia."

booster:
  activated: "{prefix}<green>Booster ativado! <yellow>{type}</yellow> +{multiplier}% por {duration}s."
  expired: "{prefix}<red>Seu booster expirou."

tournament:
  joined: "{prefix}<green>Você entrou no torneio!"
  score: "{prefix}<gray>Sua pontuação: <aqua>{score}"
  position: "{prefix}<gray>Sua posição: <aqua>#{position}"
  no-active: "{prefix}<red>Não há torneio ativo no momento."

level:
  up: "{prefix}<gold><bold>LEVEL UP! <yellow>Você alcançou o nível <aqua>{level}<yellow>!"
  xp-gained: "{prefix}<gray>+{xp} XP de pesca"

stats:
  header: "<dark_aqua><bold>🎣 Suas Estatísticas"
  level: "<gray>Nível: <aqua>{level}"
  xp: "<gray>XP: <aqua>{xp}"
  total: "<gray>Total pescado: <aqua>{total}"
  biggest: "<gray>Maior peixe: <aqua>{length}"

help:
  header: "<dark_aqua><bold>🎣 AlkaFish - Comandos"
  bag: "<gray>/fish <yellow>- Abre sua Fish Bag"
  sell: "<gray>/fish sell <yellow>- Vender peixes"
  codex: "<gray>/fish codex <yellow>- Ver coleção"
  tournament: "<gray>/fish tournament <yellow>- Info do torneio"
  stats: "<gray>/fish stats <yellow>- Suas estatísticas"
  rod: "<gray>/fish rod <yellow>- Gerenciar vara"
  enchant: "<gray>/fish enchant <yellow>- Encantamentos da vara"
  class: "<gray>/fish class <yellow>- Classes de armadura"
  invis: "<gray>/fish invis <yellow>- Toggle invisibilidade"

admin:
  reloaded: "<green>AlkaFish recarregado!"
  tournament-started: "<green>Torneio iniciado!"
  tournament-stopped: "<green>Torneio encerrado!"
  xp-given: "<green>+{xp} XP para {player}"
  help-header: "<dark_red><bold>🔧 AlkaFish Admin"
  help-reload: "<gray>/alkafish reload <yellow>- Recarregar configs"
  help-tournament: "<gray>/alkafish tournament start <tipo> [min] <yellow>- Iniciar torneio"
  help-givexp: "<gray>/alkafish givexp <player> <amount> <yellow>- Dar XP"
  help-npc: "<gray>/alkafish npc spawn|remove <yellow>- Gerenciar NPC de pesca"
  help-setrod: "<gray>/alkafish setrod <player> <rod-id> <yellow>- Setar vara"
  help-area: "<gray>/alkafish area set|spawn|lobby|saida|info <yellow>- Configurar área de pesca"

errors:
  no-permission: "{prefix}<red>Sem permissão!"
  player-not-found: "{prefix}<red>Jogador não encontrado!"
  invalid-fish: "{prefix}<red>Peixe inválido!"

rod:
  upgraded: "{prefix}<green>Vara upada para <aqua>Lvl.{level}<green>!"
  repaired: "{prefix}<green>Vara reparada!"
  broken: "{prefix}<red>Sua vara quebrou! O peixe era muito pesado."
  broke_afk: "{prefix}<red><bold>Sua vara quebrou!</bold> <gray>Você parou de pescar."
  no-rod: "{prefix}<red>Você não tem uma vara de pesca!"
