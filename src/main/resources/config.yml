# ================= AlkaFish =================

leveling:
  max-level: 50
  base-xp: 100
  xp-multiplier: 1.5

tension-game:
  enabled: true
  base-duration-ticks: 100
  difficulty-scaling: 0.8

tournaments:
  auto-start-enabled: true
  auto-start-interval-minutes: 120
  default-duration-minutes: 15
  sell-multiplier-during-tournament: 1.5
  rewards:
    1:
      - "alkaeconomy give {player} gold 5000"
      - "give {player} diamond 5"
    2:
      - "alkaeconomy give {player} gold 2500"
      - "give {player} diamond 2"
    3:
      - "alkaeconomy give {player} gold 1000"

integrations:
  alkashop-sell-enabled: true
  alkadrop-auto-sell: false
  itemsadder-textures: true
  worldguard-regions: true
  alkavips:
    luck-vip-id: "vip_fisher"
    luck-bonus: 0.05

cooking:
  enabled: true

# === NOVAS SEÇÕES v1.1.0 ===
rods:
  enabled: true
  evolute-crescent: true
  sum-evolute: true
  rod-slot: 0
  menu-slot: 4

classes:
  enabled: true
  ordered: true

npc:
  enabled: true

fishing-area:
  enabled: true
  water-radius: 10.0
  verify-water: false
  cancel-fish-interact: false
  # Distância máxima (blocos) entre o jogador e o hook antes de recolher a linha
  # automaticamente. -1 desativa o limite (pode andar com a linha lançada).
  max-fishing-distance: 50
  # Limite INICIAL de itens (soma de todas as quantias) que a Sacola de Peixes aguenta -
  # cada jogador começa com esse valor, mas pode upar pagando (ver bag-upgrade abaixo).
  # Ao atingir o limite atual do jogador, o peixe escapa e a linha recolhe sozinha (se
  # tava no AFK) até vender alguns peixes. 0 ou negativo desativa o limite.
  max-bag-items: 500
  bag-upgrade:
    # Quanto cada compra soma no limite do jogador.
    limit-per-level: 100
    # Custo em coins da 1ª compra - cresce exponencialmente a cada nível já comprado.
    base-cost-coins: 5000.0
    # Multiplicador de custo por nível já comprado (1.2 = +20% a cada upgrade).
    cost-growth: 1.2
  time-restrict:
    enabled: false
    gmt-offset: -3
    from: "10:00"
    to: "18:00"
  invisibility:
    enabled: true
    auto-toggle: true
  pvp: false
  allowed-commands:
    - "/g"
    - "/l"
    - "/fish"
  exit-commands:
    - "/spawn"
    - "/sair"

mcmmo:
  enabled: true
  skill-name: "FISHING"
  base-xp: 5.0

area-scoreboard:
  enabled: true
  title: "<dark_aqua><bold>AlkaFish"
  delay-seconds: 1
  lines:
    - "<gray> Área de Pesca"
    - ""
    - "<gray>Status: <green>{status}"
    - ""
    - "<gray>Peixes: <aqua>{fished}"
    - "<gray>Tempo: <aqua>{time}"
    - ""
    - "<dark_aqua> Vara"
    - "<dark_gray> ❘<gray> Nível: <aqua>{rod_level}"
    - "<dark_gray> ❘<gray> Nacar: <aqua>{nacar_has}<gray>/<aqua>{nacar_next}"
    - "<dark_gray> ❘ {progressbar}"
    - ""
    - "<gray>Classe: <aqua>{class}"
    - ""
    - "<gray>Coins: <green>${money}"

fish-bag:
  base-capacity-kg: 50.0
  capacity-upgrade-cost-coins: 1000
  capacity-upgrade-cost-nacar: 50
  capacity-per-upgrade: 10.0

auto-sell:
  enabled: true
  delay-seconds: 5
  close-menu: true

stock-market:
  enabled: false
