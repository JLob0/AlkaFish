# Varas de pesca do AlkaFish
# nv 0 = quebrável | nv 1 = inquebrável (evolução)

rods:
  quebravel:
    level: 0
    display-name: "<gray>Vara de Pesca"
    material: FISHING_ROD
    custom-model-data: 20001
    supported-weight: 5.0
    delay-seconds: 8
    break-on-heavy: true
    unbreakable: false
    break-chance: 15.0 # % de quebrar a cada peixe pescado no AFK
    allow-auto-sell: false
    repair-cost:
      coins: 50.0
      nacar: 0
    upgrade-cost:
      coins: 500.0
      nacar: 10
    enchant-base-cost: 10
    rewards:
      - "10.0,common_reward"
    item:
      name: "<b>Vara de Pesca <gray>[Nv.{level}]"
      lore:
        - ""
        - "<gray>❘ Peso suportado: <green>{weight}kg"
        - "<gray>❘ Delay: <green>{delay}s"
        - "<gray>❘ Nacar: <aqua>{nacar_has}<gray>/<aqua>{nacar_next} <gray>({progressbar}<gray>)"
        - ""
        - "{enchants}"
        - ""
        - "<red>Quebrável - pode quebrar enquanto pesca"
    shop:
      upgrade:
        material: FISHING_ROD
        name: "<b>Vara de Pesca <gray>[Nv.{level}]"
        lore:
          - ""
          - "<gray>❘ Peso suportado: <green>{weight}kg"
          - "<gray>❘ Delay: <green>{delay}s"
          - ""
          - "<green>Clique para obter (Grátis)"
      has:
        material: FISHING_ROD
        name: "<b>Vara de Pesca <gray>[Nv.{level}]"
        lore:
          - ""
          - "<gray>❘ Peso suportado: <green>{weight}kg"
          - "<gray>❘ Delay: <green>{delay}s"
          - ""
          - "<red>Você já possui uma vara igual ou melhor."

  inquebravel:
    level: 1
    display-name: "<gold>Vara Inquebrável"
    material: FISHING_ROD
    custom-model-data: 20002
    supported-weight: 30.0
    delay-seconds: 4
    break-on-heavy: false
    unbreakable: true
    break-chance: 0.0
    allow-auto-sell: true
    repair-cost:
      coins: 0
      nacar: 0
    upgrade-cost:
      coins: 0
      nacar: 0
    enchant-base-cost: 50
    rewards:
      - "20.0,common_reward"
      - "10.0,rare_reward"
      - "3.0,legendary_reward"
    item:
      name: "<b>Vara Inquebrável <gold>[Nv.{level}]"
      lore:
        - ""
        - "<gray>❘ Peso suportado: <green>{weight}kg"
        - "<gray>❘ Delay: <green>{delay}s"
        - "<gray>❘ Nacar: <aqua>{nacar_has}<gray>/<aqua>{nacar_next} <gray>({progressbar}<gray>)"
        - ""
        - "{enchants}"
        - ""
        - "<dark_gray>Inquebrável ∞"
    shop:
      upgrade:
        material: FISHING_ROD
        name: "<b>Vara Inquebrável <gold>[Nv.{level}]"
        lore:
          - ""
          - "<gray>❘ Peso suportado: <green>{weight}kg"
          - "<gray>❘ Delay: <green>{delay}s"
          - ""
          - "<gray>Custo: <green>{coins} coins <gray>+ <aqua>{nacar} nacar"
          - ""
          - "<green>Clique para evoluir"
      has:
        material: FISHING_ROD
        name: "<b>Vara Inquebrável <gold>[Nv.{level}]"
        lore:
          - ""
          - "<gray>❘ Peso suportado: <green>{weight}kg"
          - "<gray>❘ Delay: <green>{delay}s"
          - ""
          - "<red>Você já possui uma vara igual ou melhor."
