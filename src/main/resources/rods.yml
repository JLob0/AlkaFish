# Varas de pesca do AlkaFish
# Progressão (10 tiers, inspirada no antigo yPesca do MestreDEV): quebravel(nv0) ->
# reforcada(nv1) -> aco(nv2) -> carbono(nv3) -> titanio(nv4) -> profundezas(nv5) ->
# coralica(nv6) -> netuno(nv7) -> poseidon(nv8) -> lendaria(nv9, evolução final).
# Só as 3 últimas (netuno/poseidon/lendaria) são unbreakable de verdade - as outras
# 7 quebram por peso (break-on-heavy) e/ou por uso (break-chance).

rods:
  quebravel:
    level: 0
    display-name: "<gray>Vara de Pesca"
    material: FISHING_ROD
    custom-model-data: 20001
    supported-weight: 5.0
    delay-seconds: 9
    break-on-heavy: true
    unbreakable: false
    break-chance: 15.0 # % de quebrar a cada peixe pescado no AFK
    allow-auto-sell: false
    repair-cost:
      gold: 50.0
      nacar: 0
    upgrade-cost:
      gold: 500.0
      nacar: 10
    enchant-base-cost: 10
    rewards:
      - "10.0,common_reward"
      - "2.0,chave_pesca"
    item:
      name: "<b>Vara de Pesca <gray>[Nv.{level}]"
      lore:
        - ""
        - "<gray>❘ Peso suportado: <green>{weight}kg"
        - "<gray>❘ Delay: <green>{delay}s"
        - "<gray>❘ Nacar: <aqua>{nacar_has}<gray>/<aqua>{nacar_next} <gray>({progressbar}<gray>)"
        - ""
        - "{enchants}"
        - ""
        - "<red>Quebrável - pode quebrar enquanto pesca"

