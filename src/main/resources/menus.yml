      - ""
      - "<yellow>Clique para upar"
  upar-bloqueado:
    material: RED_STAINED_GLASS_PANE
    name: "<green>⬆ Upgradar Vara (Bloqueado)"
    lore:
      - "<gray>Próxima: {proxima}"
      - "<gray>Custo: <green>{custo-coins} Gold <gray>+ <aqua>{custo-nacar} nacar"
