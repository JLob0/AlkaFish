    name: "<green>⚙ Auto-Venda: <bold>ON"
    lore:
      - "<gray>Vende a sacola inteira sozinha"
      - "<gray>assim que ela encher."
      - ""
      - "<yellow>Clique para desligar"
  auto-venda-off:
    material: GRAY_DYE
    name: "<gray>⚙ Auto-Venda: <bold>OFF"
    lore:
      - "<gray>Vende a sacola inteira sozinha"
