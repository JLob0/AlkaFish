    name: "<yellow>🔧 Reparar Vara (Bloqueado)"
    lore:
      - "<gray>Custo: <green>{custo-coins} Gold <gray>+ <aqua>{custo-nacar} nacar"
      - "<red>Você não tem recursos suficientes."
  em-boas-condicoes:
    material: LIME_DYE
    name: "<green>✔ Vara em boas condições"
    lore:
      - "<gray>Sua vara não precisa de reparos."
  skins:
    material: PAINTING
    name: "<light_purple>🎨 Skins da Vara"
    lore:
      - "<gray>Troque a aparência da sua vara"
      - "<gray>entre as que você já desbloqueou."
      - ""
      - "<yellow>Clique para abrir"
  auto-upgrade-on:
    material: LIME_DYE
    name: "<green>⚙ Auto-Upgrade: <bold>ON"
    lore:
      - "<gray>Upa a vara sozinha assim que"
      - "<gray>tiver Gold + nacar suficientes."
      - ""
      - "<yellow>Clique para desligar"
  auto-upgrade-off:
    material: GRAY_DYE
    name: "<gray>⚙ Auto-Upgrade: <bold>OFF"
    lore:
      - "<gray>Upa a vara sozinha assim que"
      - "<gray>tiver Gold + nacar suficientes."
      - ""
      - "<yellow>Clique para ligar"
  auto-upgrade-bloqueado:
    material: GRAY_DYE
    name: "<gray>⚙ Auto-Upgrade <dark_gray>[VIP]"
    lore:
      - "<gray>Upa a vara sozinha assim que"
      - "<gray>tiver Gold + nacar suficientes."
      - ""
      - "<red>Perk VIP não desbloqueado."
  fechar:
    material: BARRIER
    name: "<red>Fechar"

enchant:
