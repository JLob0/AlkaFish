# AlkaFish - icone/nome/lore das GUIs (posicao continua em gui-layouts.yml).
# Placeholders entre {} sao trocados na hora. MiniMessage. Conteudo genuinamente
# dinamico (peixe pescado, vara real, recompensa real, listas de tamanho variavel)
# continua no Java - so o "chrome" (botoes, cabecalhos, estados fixos) fica aqui.

common:
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: "<black>♥"
  voltar:
    material: ARROW
    name: "<yellow>⬅ Voltar"

fishing-area:
  perfil:
    material: PLAYER_HEAD
    name: "<aqua>Suas Informações"
    lore:
      - ""
      - "<gray>❘ Nível da vara: <white>{rod-info}"
      - "<gray>❘ Peixes pescados: <white>{caught}"
      - "<gray>❘ Peso total pescado: <white>{weight}"
      - ""
      - "<gray>❘ Tempo pescando: <white>{fishing-time}"
      - "<gray>❘ Nacar: <aqua>{nacar}"
  acao-ir:
    material: SEA_LANTERN
    name: "<aqua>🏝 Ir para a Área de Pesca"
    lore:
      - "<gray>Teleportar e ganhar a vara"
      - ""
      - "<yellow>Clique para entrar"
  acao-sair:
    material: RED_BED
    name: "<red>⬅ Sair da Área de Pesca"
    lore:
      - "<gray>Voltar para o spawn"
      - ""
      - "<yellow>Clique para sair"
  acao-nao-configurada:
    material: BARRIER
    name: "<red>Área não configurada"
    lore:
      - "<gray>Configure com /alkafish setarea"
  vara:
    material: FISHING_ROD
    name: "<aqua>🎣 Sua Vara"
    lore:
      - "<gray>Informações, upar e reparar"
      - ""
      - "<yellow>Clique para abrir"
  encantamentos:
    material: ENCHANTED_BOOK
    name: "<dark_purple>✨ Encantamentos"
    lore:
      - "<gray>Sortudo, Multiplicador, Chaveiro"
      - ""
      - "<yellow>Clique para abrir"
  classes:
    material: LEATHER_CHESTPLATE
    name: "<gold>🛡 Classes de Pesca"
    lore:
      - "<gray>Armaduras com bônus"
      - ""
      - "<yellow>Clique para abrir"
  torneio:
    material: TROPICAL_FISH
    name: "<gold>🏆 Torneio"
    lore:
      - "<gray>Info do torneio ativo"
      - ""
      - "<yellow>Clique para abrir"
  sacola:
    material: EMERALD
    name: "<green>💰 Sacola de Peixes"
    lore:
      - "<gray>Veja e venda seus peixes"
      - ""
      - "<yellow>Clique para abrir"
  codex:
    material: BOOK
    name: "<yellow>📖 Codex de Peixes"
    lore:
      - "<gray>Coleção de peixes"
      - ""
      - "<yellow>Clique para abrir"
  top:
    material: COMPASS
    name: "<gold>🏆 TOP Pescaria"
    lore:
      - "<gray>Ranking geral (peixes, nácar, peso, tempo)"
      - ""
      - "<yellow>Clique para abrir"
  pvp-on:
    material: IRON_SWORD
    name: "<red>⚔ PvP: <bold>ON"
    lore:
      - "<gray>Só toma dano de outro jogador"
      - "<gray>se os dois tiverem PvP ligado."
      - ""
      - "<yellow>Clique para desligar"
  pvp-off:
    material: SHIELD
    name: "<green>🛡 PvP: <bold>OFF"
    lore:
      - "<gray>Só toma dano de outro jogador"
      - "<gray>se os dois tiverem PvP ligado."
      - ""
      - "<yellow>Clique para ligar"
